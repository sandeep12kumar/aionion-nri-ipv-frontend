# Amplify build settings, used when Amplify builds this repository from GitHub.
# Set VITE_API_URL and VITE_WS_URL under Amplify → Hosting → Environment variables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
